tasks:
  player:
    provider: anthropic
    model: claude-haiku-4-5
    prompt_override:
      system: true
mcp_servers:
  mud:
    command: ruby
    args:
      - /app/mud_manager/bin/mud-manager
      - --mcp
    env:
      MUD_HOST: circlemud
      MUD_PORT: "4000"
      MUD_USERNAME: dummy
      MUD_PASSWORD: helloworld
      MUD_TELNET_LOG: /data/telnet.jsonl
